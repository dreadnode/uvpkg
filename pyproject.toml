[project]
name = "uvpkg"
version = "0.1.0"
description = "Universal AI coding package manager - Python/UV reimplementation of openpackage"
readme = "README.md"
authors = [{ name = "moo", email = "will@dreadnode.io" }]
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["ai", "coding", "package-manager", "claude", "cursor", "windsurf"]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "tomlkit>=0.12.0",
    "jsonpath-ng>=1.6.0",
]

[project.scripts]
uvpkg = "uvpkg.cli:main"

[project.urls]
Homepage = "https://github.com/dreadnode/uvpkg"
Repository = "https://github.com/dreadnode/uvpkg"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uvpkg"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
